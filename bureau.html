<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Bureau · Planning BK+ (démo)</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="app.css">
<style>
.app{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 38px)}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:800;font-size:18px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:14px;letter-spacing:-.5px}
.brand small{display:block;font-size:11px;color:var(--mute);font-weight:600}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:0;background:none;text-align:left;font-weight:600;color:var(--mute);width:100%}
.nav:hover{background:var(--bg);color:var(--ink)}
.nav.on{background:var(--blue-50);color:var(--blue)}
.nav .count{margin-left:auto;background:var(--orange);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.nav .count:empty{display:none}
.nav svg{width:18px;height:18px;flex:none}
.side .who{margin-top:auto;font-size:13px;color:var(--mute);padding:10px 12px;border-top:1px solid var(--line)}
.main{padding:22px 26px;min-width:0}
.head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.head h1{font-size:22px;margin:0;margin-right:auto}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--navy);color:#fff}
.weeknav{display:flex;align-items:center;gap:6px;font-weight:700}
.weeknav button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);margin:-6px 0 14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.grid{display:grid;grid-template-columns:150px repeat(6,minmax(130px,1fr));background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:auto;box-shadow:var(--sh)}
.gh{position:sticky;top:0;background:#FAFBFC;border-bottom:1px solid var(--line);padding:10px;font-size:13px;font-weight:700;color:var(--mute);text-align:center}
.gh.today{color:var(--blue)}
.gh.today span{background:var(--blue);color:#fff;border-radius:6px;padding:1px 6px}
.tn{padding:12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-weight:700;display:flex;align-items:center;gap:8px;background:#FAFBFC}
.tn i{width:12px;height:12px;border-radius:4px}
.cell{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px;min-height:104px;display:flex;flex-direction:column;gap:6px;transition:background .15s}
.cell.today{background:#F7FAFF}
.cell.over{background:var(--blue-50);outline:2px dashed var(--blue);outline-offset:-4px}
.cell.abs{background:repeating-linear-gradient(-45deg,#F4F4F6 0 8px,#ECEDF1 8px 16px)}
.abs-label{font-size:12px;font-weight:700;color:var(--mute);text-align:center;padding-top:30px}
.card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:9px;padding:7px 8px;font-size:12px;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.04);user-select:none}
.card:hover{border-color:#C8D2DF;border-left-color:var(--c)}
.card.dragging{opacity:.4}
.card .t{font-weight:800;display:flex;align-items:center;gap:5px}
.card .t .ico{margin-left:auto;display:flex;gap:3px;color:var(--mute)}
.card .a{color:var(--ink);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .g{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.interne{background:#F6F4FF;border-left-color:#8B8FA3}
.card.cloturee{opacity:.6}
.card .dot{width:8px;height:8px;border-radius:50%;background:var(--sc)}
.dayview{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:12px;overflow:auto}
.dcol{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:300px}
.dcol h3{margin:2px 4px 6px;font-size:14px;display:flex;align-items:center;gap:8px}
.dcol h3 i{width:12px;height:12px;border-radius:4px}
.list{display:flex;flex-direction:column;gap:12px}
.row{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px;box-shadow:var(--sh)}
.row h3{margin:0 0 4px;font-size:16px}
.row .meta{color:var(--mute);font-size:13px}
.row .acts{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.photos img{width:120px;height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.comment{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px}
.empty{background:#fff;border:1px dashed #C8D2DF;border-radius:var(--r);padding:40px;text-align:center;color:var(--mute)}
.search{display:flex;gap:10px;margin-bottom:16px}
.search input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:#fff}
.timeline{border-left:2px solid var(--line);margin-left:8px;padding-left:18px;display:flex;flex-direction:column;gap:14px}
.timeline .row{position:relative}
.timeline .row::before{content:'';position:absolute;left:-26px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid #fff}
/* Panneau latéral */
.scrim{position:fixed;inset:0;background:rgba(11,35,64,.35);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#fff;z-index:41;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.12)}
.drawer:not(.on){visibility:hidden;transition:transform .25s,visibility 0s .25s}
.drawer.on{transform:none}
.drawer header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.drawer header h2{margin:0;font-size:18px}
.drawer .x{margin-left:auto;border:0;background:var(--bg);width:34px;height:34px;border-radius:9px;font-size:18px}
.drawer .body{padding:18px 20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.drawer footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 10px;font-size:14px}
.kv dt{color:var(--mute);font-weight:600}
.kv dd{margin:0;font-weight:600}
.box{border:1px solid var(--line);border-radius:12px;padding:12px}
.box h4{margin:0 0 6px;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.private{background:#FFF8F2;border-color:#FAD7BF}
.private h4{color:var(--orange-d)}
.techchips{display:flex;gap:6px;flex-wrap:wrap}
.techchips span{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border-radius:999px;padding:3px 10px 3px 6px;font-weight:700;font-size:13px}
.techchips i{width:10px;height:10px;border-radius:50%}
/* Formulaire */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--mute)}
.form .full{grid-column:1/-1}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-weight:500;color:var(--ink)}
.form textarea{min-height:80px;resize:vertical}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{flex-direction:row;align-items:center;gap:6px;background:var(--bg);padding:6px 10px;border-radius:999px;color:var(--ink);cursor:pointer}
.inline{flex-direction:row!important;align-items:center;gap:8px!important;color:var(--ink)!important}
.pdf{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px;font-size:12px;box-shadow:var(--sh)}
.pdf .l{height:8px;background:#E8ECF2;border-radius:4px;margin:6px 0}
.hint{background:var(--blue-50);color:var(--navy-2);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{flex-direction:row;overflow:auto;padding:8px}.brand,.side .who{display:none}.nav{width:auto;white-space:nowrap}.main{padding:16px}}
/* --- v2 : équipes, pièces jointes, matériel, épinglées, affaires, chantiers --- */
.card{border-left:0;position:relative;padding-left:14px}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:7px;border-radius:9px 0 0 9px;background:var(--stripe)}
.card.team{box-shadow:0 0 0 1px rgba(0,0,0,.02),0 2px 6px rgba(11,35,64,.08)}
.card .team-row{display:flex;align-items:center;gap:6px;margin-top:5px}
.card .team-row small{font-weight:700;color:var(--mute);font-size:11px}
.card.pin{background:#FFFBEB;border-color:#FDE68A}
.card.pin .t{color:#92400E}
.pinlbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#92400E}
.user{margin:0 0 6px;padding:10px 12px;border-radius:12px;background:var(--bg)}
.user label{font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.user select{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-weight:700;background:#fff}
.user small{display:block;margin-top:6px;font-size:11px;color:var(--mute)}
.navsep{font-size:11px;font-weight:800;color:#9AA8BA;text-transform:uppercase;letter-spacing:.06em;margin:12px 12px 2px}
.docs{display:flex;gap:8px;flex-wrap:wrap}
.docs .d{width:110px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;font-size:11px;font-weight:700;text-decoration:none;color:var(--ink);position:relative}
.docs .d img,.docs .d video,.docs .d .ph{width:100%;height:76px;object-fit:cover;display:block;background:#E8ECF2}
.docs .d .ph{display:grid;place-items:center;font-size:26px}
.docs .d span{display:block;padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.docs .d .rm{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.mat{margin:0;padding-left:18px;font-size:14px;font-weight:600}
.mat li{margin:3px 0}
.kanban{display:grid;grid-template-columns:repeat(3,minmax(240px,1fr));gap:14px;overflow:auto}
.kcol{background:#EDF1F6;border-radius:var(--r);padding:10px;min-height:300px}
.kcol h3{margin:4px 6px 10px;font-size:14px;display:flex;justify-content:space-between;color:var(--navy)}
.kcol h3 span{background:#fff;border-radius:999px;padding:0 8px;font-size:12px}
.aff{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.aff h4{margin:4px 0 2px;font-size:15px}
.aff p{margin:6px 0;font-size:13px;color:var(--ink)}
.aff .meta{font-size:12px;color:var(--mute)}
.aff .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.aff .acts .btn{padding:6px 10px;font-size:12px}
.src{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--blue-50);color:var(--blue)}
.src.Téléphone{background:#E6F6EF;color:var(--ok)}.src.Syndic{background:#F1EBFF;color:#6D28D9}.src.Site{background:#FFF1E8;color:var(--orange-d)}
.amount{font-weight:800;color:var(--navy)}
.chant{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.chant h3{margin:0 0 4px;font-size:18px}
.chant .desc{font-size:14px;line-height:1.5;margin:10px 0}
.progress{height:10px;background:#E8ECF2;border-radius:5px;overflow:hidden;margin:6px 0 4px}
.progress i{display:block;height:100%;background:var(--ok)}
.chant .days{display:flex;flex-direction:column;gap:6px}
.chant .day{display:flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.chant .day:hover{border-color:#C8D2DF}
.chant .day i{width:6px;align-self:stretch;border-radius:3px;background:var(--stripe)}
@media (max-width:900px){.chant{grid-template-columns:1fr}.kanban{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="demo-bar"><span><b>Démo</b> · Écran du bureau (Mac) · données fictives</span>
  <nav><a href="index.html">Accueil démo</a><a href="site.html">Site vitrine</a><a href="bureau.html" aria-current="page">Bureau</a><a href="technicien.html">Technicien</a></nav></div>

<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">BK+</div><div>BK+ Planning<small>Istres</small></div></div>
    <div class="user"><label for="who">Connecté</label><select id="who"></select><small>3 accès bureau, mêmes droits</small></div>
    <button class="nav on" data-view="planning"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Planning</button>
    <button class="nav" data-view="controle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>À contrôler<span class="count" id="c-controle"></span></button>
    <div class="navsep">Commercial</div>
    <button class="nav" data-view="affaires"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg>Affaires<span class="count" id="c-affaires"></span></button>
    <button class="nav" data-view="demandes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v12H5.2L4 17.2z"/><path d="M8 9h8M8 12h5"/></svg>Demandes du site<span class="count" id="c-demandes"></span></button>
    <button class="nav" data-view="chantiers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 20h20M5 20V9l7-5 7 5v11"/><path d="M10 20v-6h4v6"/></svg>Chantiers en cours<span class="count" id="c-chantiers" style="background:var(--navy)"></span></button>
    <div class="navsep">Suivi</div>
    <button class="nav" data-view="historique"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 3"/></svg>Historique</button>
    <div class="who"><a href="#" id="reset">Réinitialiser la démo</a></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
const $ = s => document.querySelector(s), E = BK.esc;
let view = 'planning', mode = 'semaine', weekStart = BK.monday(new Date(BK.todayIso())), dayIso = BK.todayIso(), q = '';
let me = 'bureau1'; try { me = localStorage.getItem('bk-user') || 'bureau1'; } catch(e){}
const meName = () => (BK.USERS.find(u=>u.id===me)||BK.USERS[0]).nom;
function S(){ return BK.get(); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2800); }
function save(s, i){ if(i) i.modifiePar = meName(); BK.save(s); }
const fmtEur = n => n ? n.toLocaleString('fr-FR')+' €' : '—';
const teamNames = ids => ids.map(x=>BK.tech(x).nom).join(' + ');

$('#who').innerHTML = BK.USERS.map(u=>`<option value="${u.id}">${E(u.nom)}</option>`).join('');
$('#who').value = me;
$('#who').onchange = e => { me = e.target.value; try{localStorage.setItem('bk-user',me)}catch(_){} toast('Connecté en tant que '+meName()+' : mêmes droits que le bureau'); };

function counts(){
  const s=S();
  $('#c-controle').textContent = s.interventions.filter(i=>i.statut==='controle').length || '';
  $('#c-demandes').textContent = s.demandes.filter(d=>!d.traitee).length || '';
  $('#c-affaires').textContent = s.affaires.filter(a=>a.statut==='chiffrer').length || '';
  $('#c-chantiers').textContent = s.chantiers.filter(c=>c.avancement<100).length || '';
}
function render(){
  counts();
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on', b.dataset.view===view));
  ({planning, controle, demandes, affaires, chantiers, historique})[view]();
}

/* ---------- Pièces jointes ---------- */
function docsHtml(list, removable){
  if(!list || !list.length) return '';
  return `<div class="docs">${list.map((d,k)=>{
    const icon = d.kind==='video' ? '▶️' : d.kind==='pdf' ? '📄' : '🖼';
    const media = d.kind==='photo' && d.src ? `<img src="${d.src}" alt="">` : d.kind==='video' && d.src && d.src.startsWith('blob:') ? `<video src="${d.src}" muted></video>` : `<div class="ph">${icon}</div>`;
    return `<a class="d" ${d.src?`href="${d.src}" target="_blank" rel="noopener"`:''} title="${E(d.name)}">${media}<span>${icon} ${E(d.name)}</span>${removable?`<button type="button" class="rm" data-rmdoc="${k}" aria-label="Retirer">×</button>`:''}</a>`;
  }).join('')}</div>`;
}
function readFiles(files){
  return Promise.all([...files].map(f=>new Promise(res=>{
    const kind = f.type.startsWith('image/') ? 'photo' : f.type.startsWith('video/') ? 'video' : 'pdf';
    if(kind==='photo'){ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'),k=Math.min(1,900/Math.max(img.width,img.height)); c.width=img.width*k; c.height=img.height*k; c.getContext('2d').drawImage(img,0,0,c.width,c.height); res({name:f.name,kind,src:c.toDataURL('image/jpeg',.72)}); }; img.src=r.result; }; r.readAsDataURL(f); }
    else res({name:f.name,kind,src:URL.createObjectURL(f)}); // vidéo / PDF : lisibles pendant la démo
  })));
}

/* ---------- Planning ---------- */
function cardHtml(i, techId){
  const team = i.techs.length>1;
  const rec = i.recurrent ? '<span title="Contrat d’entretien récurrent">↻</span>' : '';
  const pdf = i.devisPdf ? '<span title="Devis client joint (bureau)">📄</span>' : '';
  const pj = i.pieces && i.pieces.length ? `<span title="${i.pieces.length} pièce(s) jointe(s) pour le technicien">📎</span>` : '';
  const ch = i.chantier ? '<span title="Chantier en cours">🏗</span>' : '';
  const sc = {planifiee:'#1565D8',enroute:'#7C3AED',encours:'#B45309',controle:'#F26B1D',cloturee:'#0E9F6E'}[i.statut];
  const when = i.epingle ? '<span class="pinlbl">📌 Dans la journée</span>' : `${BK.hh(i.start)}–${BK.endTime(i.start,i.dur)}`;
  return `<div class="card ${i.type==='interne'?'interne':''} ${i.epingle?'pin':''} ${i.statut==='cloturee'?'cloturee':''} ${team?'team':''}" draggable="true" data-id="${i.id}" data-tech="${techId}" style="--stripe:${BK.stripe(i.techs)};--sc:${sc}">
    <div class="t"><span class="dot" title="${BK.STATUTS[i.statut]}"></span>${when}<span class="ico">${ch}${pj}${rec}${pdf}</span></div>
    <div class="a">${i.type==='interne'?'Tâche interne':i.epingle?E(i.travaux):E(i.ville)}</div>
    ${i.epingle?'':`<div class="g">${i.type==='interne'?E(i.travaux):E(i.agence)}</div>`}
    ${team?`<div class="team-row"><span class="avs">${BK.avatars(i.techs)}</span><small>${i.techs.length>2?i.techs.length+' techniciens':E(teamNames(i.techs))}</small></div>`:''}</div>`;
}
function sortJobs(a,b){ return (b.epingle-a.epingle) || (a.start||'').localeCompare(b.start||''); }
function planning(){
  const s=S(), days=[...Array(6)].map((_,k)=>BK.iso(BK.addDays(weekStart,k))), today=BK.todayIso();
  const title = mode==='semaine' ? `Semaine du ${BK.label(days[0])}` : BK.label(dayIso,true);
  let html = `<div class="head"><h1>Planning</h1>
    <div class="weeknav"><button id="prev" aria-label="Précédent">‹</button><span>${title}</span><button id="next" aria-label="Suivant">›</button></div>
    <div class="seg"><button data-mode="jour" class="${mode==='jour'?'on':''}">Jour</button><button data-mode="semaine" class="${mode==='semaine'?'on':''}">Semaine</button></div>
    <button class="btn" id="newpin">📌 Tâche du jour</button>
    <button class="btn orange" id="new">+ Nouvelle intervention</button></div>
    <div class="legend">${s.techs.map(t=>`<span><i style="background:${t.couleur}"></i>${t.nom}</span>`).join('')}<span>▌▌ équipe : une bande par technicien</span><span>📌 dans la journée</span><span>📎 pièces jointes</span><span>🏗 chantier</span><span>📄 devis</span></div>`;
  if(mode==='semaine'){
    html += `<div class="hint">💡 <span>Glissez une intervention vers un autre jour ou un autre technicien. Les interventions en équipe affichent la couleur de chaque technicien.</span></div><div class="grid"><div class="gh"></div>`;
    days.forEach(d=> html += `<div class="gh ${d===today?'today':''}">${d===today?'<span>'+BK.label(d)+'</span>':BK.label(d)}</div>`);
    s.techs.forEach(t=>{
      html += `<div class="tn"><i style="background:${t.couleur}"></i>${t.nom}</div>`;
      days.forEach(d=>{
        const abs = s.absences.find(a=>a.tech===t.id && a.date===d);
        const items = s.interventions.filter(i=>i.date===d && i.techs.includes(t.id)).sort(sortJobs);
        html += `<div class="cell ${d===today?'today':''} ${abs?'abs':''}" data-date="${d}" data-tech="${t.id}">${abs?`<div class="abs-label">🌴 ${E(abs.label)}</div>`:''}${items.map(i=>cardHtml(i,t.id)).join('')}</div>`;
      });
    });
    html += `</div>`;
  } else {
    html += `<div class="dayview">` + s.techs.map(t=>{
      const abs = s.absences.find(a=>a.tech===t.id && a.date===dayIso);
      const items = s.interventions.filter(i=>i.date===dayIso && i.techs.includes(t.id)).sort(sortJobs);
      return `<div class="dcol cell" data-date="${dayIso}" data-tech="${t.id}"><h3><i style="background:${t.couleur}"></i>${t.nom}</h3>${abs?`<div class="abs-label">🌴 ${E(abs.label)}</div>`:''}${items.map(i=>cardHtml(i,t.id)).join('') || (abs?'':'<div class="g" style="color:var(--mute);font-size:13px;padding:6px">Disponible</div>')}</div>`;
    }).join('') + `</div>`;
  }
  $('#main').innerHTML = html;
  $('#prev').onclick=()=>{ if(mode==='semaine') weekStart=BK.addDays(weekStart,-7); else dayIso=BK.iso(BK.addDays(new Date(dayIso+'T12:00'),-1)); render(); };
  $('#next').onclick=()=>{ if(mode==='semaine') weekStart=BK.addDays(weekStart,7); else dayIso=BK.iso(BK.addDays(new Date(dayIso+'T12:00'),1)); render(); };
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode; render();});
  $('#new').onclick=()=>openForm();
  $('#newpin').onclick=()=>openForm(null,null,{epingle:true});
  bindCards();
}
function bindCards(){
  document.querySelectorAll('.card').forEach(c=>{
    c.onclick=()=>openDetail(c.dataset.id);
    c.ondragstart=e=>{ c.classList.add('dragging'); e.dataTransfer.setData('text/plain', c.dataset.id+'|'+c.dataset.tech); };
    c.ondragend=()=>c.classList.remove('dragging');
  });
  document.querySelectorAll('.cell').forEach(cell=>{
    cell.ondragover=e=>{e.preventDefault(); cell.classList.add('over');};
    cell.ondragleave=()=>cell.classList.remove('over');
    cell.ondrop=e=>{
      e.preventDefault(); cell.classList.remove('over');
      const [id,from]=e.dataTransfer.getData('text/plain').split('|'); const s=S(); const i=s.interventions.find(x=>x.id===id); if(!i) return;
      const to=cell.dataset.tech, d=cell.dataset.date;
      if(s.absences.find(a=>a.tech===to && a.date===d)){ toast(`${BK.tech(to).nom} est absent ce jour-là`); return; }
      if(from!==to){ i.techs = i.techs.filter(x=>x!==from); if(!i.techs.includes(to)) i.techs.push(to); }
      i.date=d; save(s,i); render(); toast(`Reprogrammée : ${BK.label(d,true)} · ${teamNames(i.techs)}`);
    };
  });
}

/* ---------- Panneau latéral ---------- */
function openDrawer(html){ const d=$('#drawer'); d.innerHTML=html; d.classList.add('on'); d.setAttribute('aria-hidden','false'); $('#scrim').classList.add('on'); d.querySelector('.x').onclick=closeDrawer; }
function closeDrawer(){ $('#drawer').classList.remove('on'); $('#drawer').setAttribute('aria-hidden','true'); $('#scrim').classList.remove('on'); }
$('#scrim').onclick=closeDrawer;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });

function openDetail(id){
  const s=S(), i=s.interventions.find(x=>x.id===id); if(!i) return;
  const ch = i.chantier && s.chantiers.find(c=>c.id===i.chantier);
  openDrawer(`<header><div><span class="pill ${i.statut}">${BK.STATUTS[i.statut]}</span>${i.epingle?' <span class="pill" style="background:#FEF3C7;color:#92400E">📌 Dans la journée</span>':''}<h2 style="margin-top:8px">${i.type==='interne'?'Tâche interne':E(i.adresse)}</h2><div class="meta" style="color:var(--mute)">${E(i.ville)} · ${BK.label(i.date,true)}${i.epingle?'':' · '+BK.hh(i.start)+'–'+BK.endTime(i.start,i.dur)}</div></div><button class="x" aria-label="Fermer">×</button></header>
  <div class="body">
    <div class="techchips">${i.techs.map(x=>{const t=BK.tech(x);return `<span><i style="background:${t.couleur}"></i>${t.nom}</span>`}).join('')}${i.recurrent?'<span>↻ Récurrente (contrat)</span>':''}</div>
    ${ch?`<div class="box"><h4>🏗 Chantier</h4><b>${E(ch.nom)}</b> · ${E(ch.client)} <a href="#" id="goch">Voir le chantier →</a></div>`:''}
    ${i.type==='interne'||i.epingle?'':`<dl class="kv"><dt>Agence</dt><dd>${E(i.agence)}</dd><dt>Occupant</dt><dd>${E(i.occupant)}</dd><dt>Téléphone</dt><dd><a href="tel:${E(i.tel)}">${E(String(i.tel).replace(/(\d{2})(?=\d)/g,'$1 '))}</a></dd><dt>Adresse</dt><dd>${E(i.adresse)}, ${E(i.ville)}</dd></dl>`}
    <div class="box"><h4>Travaux à effectuer</h4>${E(i.travaux)}</div>
    ${i.materiel&&i.materiel.length?`<div class="box"><h4>🧰 Matériel nécessaire</h4><ul class="mat">${i.materiel.map(m=>`<li>${E(m)}</li>`).join('')}</ul></div>`:''}
    ${i.pieces&&i.pieces.length?`<div class="box"><h4>📎 Pièces jointes pour le technicien</h4>${docsHtml(i.pieces)}</div>`:''}
    ${i.type==='interne'||i.epingle?'':`<div class="box private"><h4>🔒 Devis client · visible uniquement par le bureau</h4>${i.devisPdf?`<div class="pdf"><b>DEVIS N° ${id.toUpperCase()}</b><div class="l" style="width:70%"></div><div class="l"></div><div class="l" style="width:85%"></div><div class="l" style="width:40%"></div></div>`:'<span style="color:var(--mute);font-size:14px">Aucun devis joint.</span>'} <label class="btn" style="margin-top:10px">📎 ${i.devisPdf?'Remplacer':'Joindre'} le devis PDF<input type="file" accept="application/pdf" class="sr" id="pdfin"></label></div>`}
    ${i.photos.length||i.commentaire?`<div class="box"><h4>Retour du technicien</h4>${i.commentaire?`<div>${E(i.commentaire)}</div>`:''}<div class="photos">${i.photos.map(p=>`<img src="${typeof p==='string'?p:p.src}" alt="Photo d’intervention">`).join('')}</div></div>`:''}
    <label style="font-size:13px;font-weight:700;color:var(--mute)">Statut<br><select id="st" style="margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%">${Object.entries(BK.STATUTS).map(([k,v])=>`<option value="${k}" ${k===i.statut?'selected':''}>${v}</option>`).join('')}</select></label>
    <div style="font-size:12px;color:var(--mute)">Dernière modification : ${E(i.modifiePar||'Bureau')}</div>
  </div>
  <footer>${i.statut==='controle'?'<button class="btn ok" id="close">✓ Clôturer</button>':''}<button class="btn" id="edit">Modifier</button><button class="btn" id="dup">+7 jours</button><button class="btn" id="del" style="margin-left:auto;color:var(--err)">Supprimer</button></footer>`);
  const g=$('#goch'); if(g) g.onclick=e=>{ e.preventDefault(); closeDrawer(); view='chantiers'; render(); };
  const pdfin=$('#pdfin'); if(pdfin) pdfin.onchange=()=>{ i.devisPdf=true; save(s,i); openDetail(id); render(); toast('Devis joint : invisible pour les techniciens'); };
  $('#st').onchange=e=>{ i.statut=e.target.value; save(s,i); render(); openDetail(id); };
  const c=$('#close'); if(c) c.onclick=()=>{ i.statut='cloturee'; save(s,i); closeDrawer(); render(); toast('Intervention clôturée et archivée'); };
  $('#edit').onclick=()=>openForm(i);
  $('#dup').onclick=()=>{ i.date=BK.iso(BK.addDays(new Date(i.date+'T12:00'),7)); save(s,i); closeDrawer(); render(); toast('Reprogrammée la semaine suivante'); };
  $('#del').onclick=()=>{ if(confirm('Supprimer cette intervention ?')){ s.interventions=s.interventions.filter(x=>x.id!==id); BK.save(s); closeDrawer(); render(); toast('Intervention supprimée'); } };
}

/* ---------- Formulaire d’intervention ---------- */
function openForm(i, prefill, opts){
  const s=S(), isNew=!i; opts=opts||{};
  i = i || { id:BK.uid(), type:'intervention', statut:'planifiee', photos:[], commentaire:'', devisPdf:false, recurrent:false, dur:2, start:'09:00', date:(mode==='jour'?dayIso:BK.todayIso()), techs:[], agence:'', occupant:'', tel:'', adresse:'', ville:'Istres', travaux:'', materiel:[], pieces:[], epingle:!!opts.epingle, chantier:opts.chantier||null };
  if(prefill) Object.assign(i, prefill.fields);
  let pieces = [...(i.pieces||[])];
  openDrawer(`<header><h2>${isNew?(i.epingle?'📌 Tâche à faire dans la journée':'Nouvelle intervention'):'Modifier'}</h2><button class="x" aria-label="Fermer">×</button></header>
  <form class="body" id="f"><div class="form">
    <label>Type<select name="type"><option value="intervention">Intervention</option><option value="tache" ${i.type==='tache'?'selected':''}>Tâche (matériel, déchetterie…)</option><option value="interne" ${i.type==='interne'?'selected':''}>Interne (réunion…)</option></select></label>
    <label>Chantier<select name="chantier"><option value="">Aucun</option>${s.chantiers.map(c=>`<option value="${c.id}" ${i.chantier===c.id?'selected':''}>${E(c.nom)}</option>`).join('')}</select></label>
    <label class="full inline" style="background:#FFFBEB;border-radius:10px;padding:10px 12px"><input type="checkbox" name="epingle" ${i.epingle?'checked':''}> 📌 À faire dans la journée, sans heure précise (rappel au technicien avant la fin de journée)</label>
    <label>Date<input type="date" name="date" value="${i.date}" required></label>
    <label class="hr">Heure<input type="time" name="start" value="${i.start||'09:00'}" step="900"></label>
    <label class="hr">Durée (h)<input type="number" name="dur" value="${i.dur||1}" min="0.5" step="0.5"></label>
    <label>Ville<input name="ville" value="${E(i.ville)}"></label>
    <div class="full"><div style="font-size:13px;font-weight:700;color:var(--mute);margin-bottom:6px">Technicien(s) · plusieurs = équipe</div><div class="checks">${s.techs.map(t=>`<label><input type="checkbox" name="techs" value="${t.id}" ${i.techs.includes(t.id)?'checked':''}><i style="width:10px;height:10px;border-radius:50%;background:${t.couleur}"></i>${t.nom}</label>`).join('')}</div></div>
    <label class="full">Adresse<input name="adresse" value="${E(i.adresse)}"></label>
    <label>Agence / client<input name="agence" value="${E(i.agence)}" list="agences"></label>
    <label>Occupant<input name="occupant" value="${E(i.occupant)}"></label>
    <label class="full">Téléphone de l’occupant<input name="tel" type="tel" value="${E(i.tel)}"></label>
    <label class="full">Travaux à effectuer<textarea name="travaux">${E(i.travaux)}</textarea></label>
    <label class="full">🧰 Matériel nécessaire <span style="font-weight:500">(une ligne par élément)</span><textarea name="materiel" placeholder="Ex. : Siphon PVC Ø40&#10;Flexible inox 50 cm">${E((i.materiel||[]).join('\n'))}</textarea></label>
    <div class="full"><div style="font-size:13px;font-weight:700;color:var(--mute);margin-bottom:6px">📎 Pièces jointes pour le technicien <span style="font-weight:500">(photos, vidéos, PDF · facultatif)</span></div><div id="pj"></div><label class="btn" style="margin-top:8px">+ Ajouter des fichiers<input type="file" id="pjin" multiple accept="image/*,video/*,application/pdf" class="sr"></label></div>
    <label class="full inline"><input type="checkbox" name="recurrent" ${i.recurrent?'checked':''}> Intervention récurrente (contrat d’entretien)</label>
  </div><datalist id="agences">${[...new Set(s.interventions.map(x=>x.agence))].map(a=>`<option value="${E(a)}">`).join('')}</datalist></form>
  <footer><button class="btn primary" form="f" type="submit">${isNew?'Planifier':'Enregistrer'}</button><button class="btn" type="button" id="cancel">Annuler</button></footer>`);
  const f=$('#f');
  const syncPin=()=>{ const on=f.epingle.checked; f.querySelectorAll('.hr').forEach(l=>l.style.display=on?'none':''); };
  f.epingle.onchange=syncPin; syncPin();
  const drawPj=()=>{ $('#pj').innerHTML = docsHtml(pieces,true) || '<span style="font-size:13px;color:var(--mute)">Aucune pièce jointe.</span>'; $('#pj').querySelectorAll('[data-rmdoc]').forEach(b=>b.onclick=e=>{ e.preventDefault(); e.stopPropagation(); pieces.splice(+b.dataset.rmdoc,1); drawPj(); }); };
  drawPj();
  $('#pjin').onchange=e=>readFiles(e.target.files).then(list=>{ pieces=pieces.concat(list); drawPj(); toast(list.length+' fichier(s) ajouté(s) : visibles sur l’iPhone/iPad du technicien'); });
  $('#cancel').onclick=closeDrawer;
  f.onsubmit=e=>{
    e.preventDefault(); const fd=new FormData(f);
    const techs=fd.getAll('techs'); if(!techs.length){ toast('Choisissez au moins un technicien'); return; }
    const pin=!!fd.get('epingle');
    Object.assign(i,{ type:fd.get('type'), chantier:fd.get('chantier')||null, epingle:pin, date:fd.get('date'), start:pin?'':(fd.get('start')||'09:00'), dur:pin?0:(Number(fd.get('dur'))||1), ville:fd.get('ville'), techs, adresse:fd.get('adresse'), agence:fd.get('agence'), occupant:fd.get('occupant'), tel:fd.get('tel'), travaux:fd.get('travaux'), recurrent:!!fd.get('recurrent'),
      materiel:String(fd.get('materiel')||'').split('\n').map(x=>x.trim()).filter(Boolean), pieces });
    if(isNew) s.interventions.push(i);
    if(prefill && prefill.onSave) prefill.onSave(s);
    save(s,i); closeDrawer(); view='planning'; mode='semaine'; weekStart=BK.monday(new Date(i.date+'T12:00')); render();
    toast(`${pin?'Tâche épinglée':'Planifiée'} pour ${teamNames(techs)} : visible sur son iPhone/iPad`);
  };
}

/* ---------- À contrôler ---------- */
function controle(){
  const s=S(), items=s.interventions.filter(i=>i.statut==='controle').sort((a,b)=>b.date.localeCompare(a.date));
  $('#main').innerHTML = `<div class="head"><h1>À contrôler</h1></div><div class="hint">✅ <span>Les interventions validées par les techniciens arrivent ici avec leurs photos et commentaires. Seul le bureau peut les clôturer.</span></div>` +
   (items.length ? `<div class="list">${items.map(i=>`<div class="row"><div><h3>${i.epingle?'📌 '+E(i.travaux):E(i.adresse)+', '+E(i.ville)}</h3><div class="meta">${BK.label(i.date,true)} · <span class="avs">${BK.avatars(i.techs)}</span> ${E(teamNames(i.techs))} · ${E(i.agence)}</div>${i.commentaire?`<div class="comment">${E(i.commentaire)}</div>`:''}<div class="photos">${i.photos.map(p=>`<img src="${typeof p==='string'?p:p.src}" alt="Photo">`).join('')}</div></div><div class="acts"><button class="btn" data-open="${i.id}">Détails</button><button class="btn ok" data-close="${i.id}">✓ Clôturer</button></div></div>`).join('')}</div>` : `<div class="empty">Rien à contrôler pour le moment 👌</div>`);
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(b.dataset.open));
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{ const i=s.interventions.find(x=>x.id===b.dataset.close); i.statut='cloturee'; save(s,i); render(); toast('Clôturée : archivée dans l’historique'); });
}

/* ---------- Demandes du site ---------- */

    (items.length ? `<div class="list">${items.map(d=>`<div class="row" style="${d.traitee?'opacity:.55':''}"><div><h3>${E(d.nom)} · ${E(d.ville)}</h3><div class="meta">${BK.label(d.date,true)} · ${E(d.service)} · <a href="tel:${E(d.tel)}">${E(d.tel)}</a></div><div class="comment">${E(d.message)}</div></div><div class="acts">${d.traitee?'<span class="pill cloturee">Traitée</span>':`<button class="btn" data-aff="${d.id}">→ Affaire (devis)</button><button class="btn orange" data-plan="${d.id}">Planifier</button>`}</div></div>`).join('')}</div>` : `<div class="empty">Aucune demande pour le moment.</div>`);

}

/* ---------- Affaires ---------- */
function affaires(){
  const s=S(), cols=[['chiffrer','À chiffrer'],['devis','Devis envoyé'],['accepte','Accepté']];
  const card=a=>`<div class="aff"><span class="src ${E(a.source.split(' ')[0])}">${E(a.source)}</span> <span class="meta">· ${BK.label(a.date)}</span>
    <h4>${E(a.client)}</h4><div class="meta">${E(a.adresse?a.adresse+', ':'')}${E(a.ville)} · <a href="tel:${E(a.tel)}">${E(a.tel)}</a></div>
    <p>${E(a.objet)}</p><div><span class="amount">${fmtEur(a.montant)}</span> ${a.devisPdf?'<span class="meta">· 📄 devis joint</span>':''}</div>
    <div class="acts">${a.statut==='chiffrer'?`<button class="btn" data-mv="${a.id}|devis">Devis envoyé →</button>`:''}${a.statut==='devis'?`<button class="btn ok" data-mv="${a.id}|accepte">✓ Accepté</button><button class="btn" data-mv="${a.id}|refuse">Refusé</button>`:''}${a.statut==='accepte'?`<button class="btn orange" data-plan="${a.id}">Planifier</button><button class="btn" data-ch="${a.id}">🏗 En chantier</button>`:''}<button class="btn" data-ed="${a.id}">Modifier</button></div></div>`;
  $('#main').innerHTML = `<div class="head"><h1>Affaires</h1><button class="btn orange" id="newa">+ Nouvelle affaire</button></div>
   <div class="hint">💼 <span>Saisissez ici les demandes reçues par téléphone, par e-mail d’une agence, par un syndic ou par bouche-à-oreille, et suivez vos devis jusqu’à l’acceptation.</span></div>
   <div class="kanban">${cols.map(([k,l])=>{ const it=s.affaires.filter(a=>a.statut===k); const tot=it.reduce((n,a)=>n+(a.montant||0),0); return `<div class="kcol"><h3>${l}<span>${it.length}${tot?' · '+fmtEur(tot):''}</span></h3>${it.map(card).join('')||'<div class="meta" style="padding:6px;color:var(--mute);font-size:13px">Rien ici.</div>'}</div>`; }).join('')}</div>
   ${s.affaires.some(a=>a.statut==='refuse')?`<p class="meta" style="color:var(--mute);margin-top:14px">${s.affaires.filter(a=>a.statut==='refuse').length} devis refusé(s), archivé(s).</p>`:''}`;
  $('#newa').onclick=()=>affForm();
  document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>affForm(s.affaires.find(a=>a.id===b.dataset.ed)));
  document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{ const [id,st]=b.dataset.mv.split('|'); s.affaires.find(a=>a.id===id).statut=st; BK.save(s); render(); toast(st==='accepte'?'Devis accepté 🎉 : vous pouvez planifier':'Affaire mise à jour'); });
  document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{ const a=s.affaires.find(x=>x.id===b.dataset.plan); openForm(null,{fields:{agence:a.client,occupant:a.client,tel:a.tel,adresse:a.adresse,ville:a.ville,travaux:a.objet,devisPdf:a.devisPdf}}); });
  document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{ const a=s.affaires.find(x=>x.id===b.dataset.ch); chantierForm(null,a); });
}
function affForm(a){
  const s=S(), isNew=!a; a = a || {id:BK.uid(),date:BK.todayIso(),source:'Téléphone',client:'',tel:'',adresse:'',ville:'Istres',objet:'',montant:0,statut:'chiffrer',devisPdf:false};
  openDrawer(`<header><h2>${isNew?'Nouvelle affaire':'Modifier l’affaire'}</h2><button class="x" aria-label="Fermer">×</button></header>
  <form class="body" id="fa"><div class="form">
    <label>Provenance<select name="source">${['Téléphone','Agence (e-mail)','Syndic','Bouche-à-oreille','Site','Autre'].map(x=>`<option ${a.source===x?'selected':''}>${x}</option>`).join('')}</select></label>
    <label>Étape<select name="statut">${Object.entries(BK.AFF).map(([k,v])=>`<option value="${k}" ${a.statut===k?'selected':''}>${v}</option>`).join('')}</select></label>
    <label class="full">Client<input name="client" value="${E(a.client)}" required></label>
    <label>Téléphone<input name="tel" value="${E(a.tel)}"></label><label>Ville<input name="ville" value="${E(a.ville)}"></label>
    <label class="full">Adresse<input name="adresse" value="${E(a.adresse)}"></label>
    <label class="full">Objet / besoin<textarea name="objet">${E(a.objet)}</textarea></label>
    <label>Montant du devis (€)<input type="number" name="montant" value="${a.montant||''}" min="0" step="10"></label>
    <label>Devis PDF<span class="btn" style="justify-content:flex-start"><input type="file" accept="application/pdf" name="pdf" style="font-size:12px"></span></label>
  </div></form><footer><button class="btn primary" form="fa" type="submit">Enregistrer</button><button class="btn" type="button" id="cancel">Annuler</button></footer>`);
  $('#cancel').onclick=closeDrawer;
  $('#fa').onsubmit=e=>{ e.preventDefault(); const fd=new FormData(e.target);
    Object.assign(a,{source:fd.get('source'),statut:fd.get('statut'),client:fd.get('client'),tel:fd.get('tel'),ville:fd.get('ville'),adresse:fd.get('adresse'),objet:fd.get('objet'),montant:Number(fd.get('montant'))||0, devisPdf:a.devisPdf||!!(fd.get('pdf')&&fd.get('pdf').size)});
    if(isNew) s.affaires.push(a); BK.save(s); closeDrawer(); render(); toast('Affaire enregistrée'); };
}

/* ---------- Chantiers en cours ---------- */
function chantiers(){
  const s=S();
  $('#main').innerHTML = `<div class="head"><h1>Chantiers en cours</h1><button class="btn orange" id="newc">+ Nouveau chantier</button></div>
   <div class="hint">🏗 <span>Uniquement les gros chantiers sur plusieurs jours : description, devis, équipe, avancement, et toutes les journées planifiées au même endroit.</span></div>
   <div class="list">${s.chantiers.map(c=>{ const days=s.interventions.filter(i=>i.chantier===c.id).sort((a,b)=>a.date.localeCompare(b.date));
     const photos=c.photos.concat(days.flatMap(d=>d.photos.map(p=>typeof p==='string'?p:p.src)));
     return `<div class="chant"><div>
       <span class="src">${E(c.client)}</span><h3 style="margin-top:8px">${E(c.nom)}</h3><div class="meta" style="color:var(--mute);font-size:13px">${E(c.adresse)}, ${E(c.ville)} · du ${BK.label(c.debut)} au ${BK.label(c.fin)}</div>
       <div class="desc">${E(c.description)}</div>
       <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:14px;align-items:center"><span><b>Devis :</b> <span class="amount">${fmtEur(c.montant)}</span> ${c.devisPdf?'📄':''}</span><span><b>Équipe :</b> <span class="avs">${BK.avatars(c.techs)}</span> ${E(teamNames(c.techs))}</span></div>
       <div style="margin-top:12px;font-size:13px;font-weight:700;display:flex;justify-content:space-between"><span>Avancement</span><span>${c.avancement} %</span></div>
       <div class="progress"><i style="width:${c.avancement}%"></i></div>
       <input type="range" min="0" max="100" step="10" value="${c.avancement}" data-av="${c.id}" style="width:100%" aria-label="Avancement">
       ${photos.length?`<div class="photos">${photos.map(p=>`<img src="${p}" alt="Photo du chantier">`).join('')}</div>`:''}
     </div><div><div style="font-weight:800;margin-bottom:8px">Journées planifiées</div><div class="days">${days.map(d=>`<div class="day" data-open="${d.id}" style="--stripe:${BK.stripe(d.techs)}"><i></i><div><b>${BK.label(d.date)}</b> · ${BK.hh(d.start)}<br><span style="color:var(--mute)">${E(teamNames(d.techs))} · ${BK.STATUTS[d.statut]}</span></div></div>`).join('')||'<div class="meta" style="color:var(--mute);font-size:13px">Aucune journée planifiée.</div>'}</div>
       <button class="btn" style="margin-top:10px;width:100%" data-addday="${c.id}">+ Planifier une journée</button>
       <button class="btn" style="margin-top:8px;width:100%" data-done="${c.id}">✓ Chantier terminé</button></div></div>`; }).join('') || '<div class="empty">Aucun chantier en cours.</div>'}</div>`;
  $('#newc').onclick=()=>chantierForm();
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(b.dataset.open));
  document.querySelectorAll('[data-av]').forEach(r=>r.onchange=()=>{ s.chantiers.find(c=>c.id===r.dataset.av).avancement=+r.value; BK.save(s); render(); });
  document.querySelectorAll('[data-addday]').forEach(b=>b.onclick=()=>{ const c=s.chantiers.find(x=>x.id===b.dataset.addday); openForm(null,{fields:{techs:[...c.techs],agence:c.client,occupant:'',adresse:c.adresse,ville:c.ville,travaux:c.nom+' : ',dur:8,start:'08:00',devisPdf:c.devisPdf}},{chantier:c.id}); });
  document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{ if(!confirm('Marquer ce chantier comme terminé ?')) return; s.chantiers=s.chantiers.filter(c=>c.id!==b.dataset.done); BK.save(s); render(); toast('Chantier terminé : ses interventions restent dans l’historique'); });
}
function chantierForm(c, aff){
  const s=S(); c = c || {id:BK.uid(),nom:'',client:aff?aff.client:'',adresse:aff?aff.adresse:'',ville:aff?aff.ville:'Istres',description:aff?aff.objet:'',montant:aff?aff.montant:0,debut:BK.todayIso(),fin:BK.todayIso(),techs:[],avancement:0,devisPdf:aff?aff.devisPdf:false,photos:[]};
  openDrawer(`<header><h2>Nouveau chantier</h2><button class="x" aria-label="Fermer">×</button></header>
  <form class="body" id="fc"><div class="form">
    <label class="full">Nom du chantier<input name="nom" value="${E(c.nom)}" placeholder="Ex. : Rénovation salle de bain" required></label>
    <label class="full">Client<input name="client" value="${E(c.client)}"></label>
    <label class="full">Adresse<input name="adresse" value="${E(c.adresse)}"></label><label>Ville<input name="ville" value="${E(c.ville)}"></label>
    <label>Montant du devis (€)<input type="number" name="montant" value="${c.montant||''}"></label>
    <label>Début<input type="date" name="debut" value="${c.debut}"></label><label>Fin prévue<input type="date" name="fin" value="${c.fin}"></label>
    <div class="full"><div style="font-size:13px;font-weight:700;color:var(--mute);margin-bottom:6px">Équipe</div><div class="checks">${s.techs.map(t=>`<label><input type="checkbox" name="techs" value="${t.id}"><i style="width:10px;height:10px;border-radius:50%;background:${t.couleur}"></i>${t.nom}</label>`).join('')}</div></div>
    <label class="full">Description<textarea name="description" style="min-height:120px">${E(c.description)}</textarea></label>
    <label class="full">Devis PDF<input type="file" accept="application/pdf" name="pdf"></label>
  </div></form><footer><button class="btn primary" form="fc" type="submit">Créer le chantier</button><button class="btn" type="button" id="cancel">Annuler</button></footer>`);
  $('#cancel').onclick=closeDrawer;
  $('#fc').onsubmit=e=>{ e.preventDefault(); const fd=new FormData(e.target);
    Object.assign(c,{nom:fd.get('nom'),client:fd.get('client'),adresse:fd.get('adresse'),ville:fd.get('ville'),montant:Number(fd.get('montant'))||0,debut:fd.get('debut'),fin:fd.get('fin'),techs:fd.getAll('techs'),description:fd.get('description'),devisPdf:c.devisPdf||!!(fd.get('pdf')&&fd.get('pdf').size)});
    s.chantiers.push(c); if(aff) aff.statut='accepte'; BK.save(s); closeDrawer(); view='chantiers'; render(); toast('Chantier créé'); };
}

/* ---------- Historique ---------- */
function historique(){
  $('#main').innerHTML = `<div class="head"><h1>Historique</h1></div>
   <div class="search"><input id="q" placeholder="Rechercher une adresse, une agence, un occupant… (ex. : 27 avenue de la Crau)" value="${E(q)}" autocomplete="off"></div><div id="res"></div>`;
  const run=()=>{
    const s=S(), k=q.trim().toLowerCase();
    let items=s.interventions.filter(i=>i.statut==='cloturee'||i.statut==='controle');
    if(k) items=s.interventions.filter(i=>[i.adresse,i.ville,i.agence,i.occupant,i.travaux].join(' ').toLowerCase().includes(k));
    items.sort((a,b)=>b.date.localeCompare(a.date));
    $('#res').innerHTML = items.length ? `<div class="meta" style="color:var(--mute);margin:0 0 12px">${items.length} intervention(s)${k?' pour « '+E(q)+' »':''}, conservées plusieurs années pour le SAV</div><div class="timeline">${items.map(i=>`<div class="row"><div><span class="pill ${i.statut}">${BK.STATUTS[i.statut]}</span><h3 style="margin-top:6px">${E(i.adresse)}, ${E(i.ville)}</h3><div class="meta">${BK.label(i.date,true)} · ${E(teamNames(i.techs))} · ${E(i.agence)}</div><div style="margin-top:8px">${E(i.travaux)}</div>${i.commentaire?`<div class="comment">${E(i.commentaire)}</div>`:''}<div class="photos">${i.photos.map(p=>`<img src="${typeof p==='string'?p:p.src}" alt="Photo">`).join('')}</div></div><div class="acts"><button class="btn" data-open="${i.id}">Ouvrir</button></div></div>`).join('')}</div>` : `<div class="empty">Aucun résultat.</div>`;
    document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(b.dataset.open));
  };
  $('#q').oninput=e=>{ q=e.target.value; run(); }; run();
}

document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{ view=b.dataset.view; render(); });
$('#reset').onclick=e=>{ e.preventDefault(); BK.reset(); render(); toast('Démo réinitialisée'); };
BK.onChange(()=>{ render(); toast('Mise à jour reçue en temps réel'); });
const h=location.hash.slice(1); if(['planning','controle','demandes','affaires','chantiers','historique'].includes(h)) view=h;
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
